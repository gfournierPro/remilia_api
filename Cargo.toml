[package]
name = "api_test"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.11", features = ["json", "cookies", "gzip", "brotli", "deflate"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
rand = "0.8"
chrono = "0.4.42"
signal = "0.7.0"
rand_distr = "0.4"
urlencoding = "2.1"
thirtyfour = "0.34" # WebDriver for automatic re-authentication
dotenv = "0.15" # Load .env file for configuration

[[bin]]
name = "beetle_hunt"
path = "src/main.rs"

[[bin]]
name = "beetle_hunt_refactored"
path = "src/main_refactored.rs"
