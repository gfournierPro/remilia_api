name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false

  build-release:
    name: Build Release
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: beetle_hunt
            asset_name: beetle_hunt-linux-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: beetle_hunt_refactored
            asset_name: beetle_hunt_refactored-linux-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: leaderboard
            asset_name: leaderboard-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: beetle_hunt
            asset_name: beetle_hunt-macos-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: beetle_hunt_refactored
            asset_name: beetle_hunt_refactored-macos-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: leaderboard
            asset_name: leaderboard-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: beetle_hunt
            asset_name: beetle_hunt-macos-aarch64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: beetle_hunt_refactored
            asset_name: beetle_hunt_refactored-macos-aarch64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: leaderboard
            asset_name: leaderboard-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: beetle_hunt.exe
            asset_name: beetle_hunt-windows-x86_64.exe
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: beetle_hunt_refactored.exe
            asset_name: beetle_hunt_refactored-windows-x86_64.exe
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: leaderboard.exe
            asset_name: leaderboard-windows-x86_64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Extract binary name
        id: extract_name
        shell: bash
        run: |
          NAME="${{ matrix.artifact_name }}"
          NAME="${NAME%.exe}"
          echo "binary_name=$NAME" >> $GITHUB_OUTPUT

      - name: Build release binary
        run: cargo build --bin ${{ steps.extract_name.outputs.binary_name }} --release --target ${{ matrix.target }}

      - name: Strip binary (Linux and macOS)
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'macos-latest'
        run: strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
          asset_name: ${{ matrix.asset_name }}
          asset_content_type: application/octet-stream
